<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="COMSOL Multiphysics">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2f5c"/>
      <stop offset="1" stop-color="#0b1630"/>
    </linearGradient>
    <linearGradient id="coil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb300"/>
      <stop offset="1" stop-color="#ff7043"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="13" fill="url(#bg)"/>
  <!-- field lines -->
  <g fill="none" stroke="#4fc3f7" stroke-width="1.6" stroke-linecap="round" opacity="0.85">
    <path d="M14 14 C26 20 38 20 50 14"/>
    <path d="M12 22 C25 29 39 29 52 22"/>
    <path d="M12 42 C25 35 39 35 52 42"/>
    <path d="M14 50 C26 44 38 44 50 50"/>
  </g>
  <!-- solenoid coil -->
  <g fill="none" stroke="url(#coil)" stroke-width="2.6" stroke-linecap="round">
    <path d="M22 20 C16 20 16 28 22 28"/>
    <path d="M22 28 C28 28 28 36 22 36"/>
    <path d="M22 36 C16 36 16 44 22 44"/>
    <path d="M42 20 C48 20 48 28 42 28"/>
    <path d="M42 28 C36 28 36 36 42 36"/>
    <path d="M42 36 C48 36 48 44 42 44"/>
  </g>
  <!-- core -->
  <rect x="22" y="20" width="20" height="24" rx="4" fill="none" stroke="#cfe9ff" stroke-width="1.4" opacity="0.55"/>
  <!-- mesh hint -->
  <g stroke="#8fd6ff" stroke-width="0.7" opacity="0.5">
    <path d="M22 32 H42 M32 20 V44"/>
  </g>
  <circle cx="32" cy="32" r="2.6" fill="#7cf6c8"/>
</svg>
